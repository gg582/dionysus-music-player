name: Package Plugins

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/package-plugins.yml'
    tags:
      - 'plugin-v*'
  workflow_dispatch:
    inputs:
      debug_build:
        description: 'Retain PyInstaller build artefacts (debug mode)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  PYINSTALLER_VERSION: '6.13.0'
  INNO_SETUP_VERSION: '6.4.2'
  PLUGIN_REPO: 'https://github.com/gosuda/gozik-yt-music.git'
  PLUGIN_DIR: 'gozik-yt-music'
  BINARY_NAME: 'gozik-yt-music-server'
  DAEMON_DESCRIPTION: 'gozik YouTube Music gRPC plugin server'
  DAEMON_PORT: '50052'

jobs:
  build-windows:
    name: 'Windows ${{ matrix.arch }} — PyInstaller + Inno Setup'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: windows-latest
            allow-failure: false
            python-arch: x64
            artifact-suffix: 'windows-amd64'
            installer-arch: 'x64Compatible'
            node-archive: 'node-v22.14.0-win-x64.zip'
            node-url: 'https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip'
          - arch: arm64
            runs-on: windows-11-arm
            allow-failure: true
            python-arch: arm64
            artifact-suffix: 'windows-arm64'
            installer-arch: 'arm64'
            node-archive: 'node-v22.14.0-win-arm64.zip'
            node-url: 'https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-arm64.zip'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone plugin repository
        shell: bash
        run: |
          cd "${{ github.workspace }}"
          cd ..
          git clone --depth 1 "${{ env.PLUGIN_REPO }}" "${{ env.PLUGIN_DIR }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python-arch }}
          cache: pip
      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r "..\${{ env.PLUGIN_DIR }}\requirements.txt"
          pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Generate protobuf stubs
        shell: bash
        run: |
          cd "${{ github.workspace }}"
          cd "../${{ env.PLUGIN_DIR }}"
          bash codegen.sh
      - name: Download Node.js standalone binary
        shell: powershell
        run: |
          $nodeUrl = "${{ matrix.node-url }}"
          $nodeZip = "${{ matrix.node-archive }}"
          Invoke-WebRequest -Uri $nodeUrl -OutFile $nodeZip -UseBasicParsing
          Expand-Archive -Path $nodeZip -DestinationPath "node_extracted" -Force
          New-Item -ItemType Directory -Path "..\${{ env.PLUGIN_DIR }}\.tools\bin" -Force | Out-Null
          Copy-Item "node_extracted\node.exe" -Destination "..\${{ env.PLUGIN_DIR }}\.tools\bin\node.exe"
      - name: Build with PyInstaller
        shell: bash
        env:
          DEBUG_FLAG: ${{ github.event.inputs.debug_build == 'true' && '--debug=all' || '' }}
        run: |
          cd "${{ github.workspace }}"
          cd "../${{ env.PLUGIN_DIR }}"
          mkdir -p certifi
          python -c "import certifi, shutil; shutil.copy(certifi.where(), 'certifi/cacert.pem')"
          pyinstaller \
            --noconfirm --clean --onedir \
            --name="${{ env.BINARY_NAME }}" \
            --distpath=dist \
            --workpath=build \
            --hidden-import=ytmusicapi \
            --hidden-import=grpc \
            --hidden-import=grpc._cython \
            --hidden-import=grpc._cython.cygrpc \
            --hidden-import=google.protobuf \
            --hidden-import=google.protobuf.internal \
            --hidden-import=yt_dlp \
            --hidden-import=yt_dlp.extractor \
            --hidden-import=yt_dlp.extractor.youtubetab \
            --hidden-import=yt_dlp.extractor.youtube \
            --hidden-import=requests \
            --hidden-import=certifi \
            --hidden-import=charset_normalizer \
            --hidden-import=idna \
            --hidden-import=urllib3 \
            --hidden-import=generated \
            --hidden-import=handlers \
            --collect-all=ytmusicapi \
            --collect-all=grpc \
            --collect-all=google.protobuf \
            --collect-all=yt_dlp \
            --collect-all=certifi \
            --add-data="generated:generated" \
            --add-data="certifi/cacert.pem:certifi" \
            --add-binary=".tools/bin/node:." \
            --exclude-module=tkinter \
            --exclude-module=unittest \
            --exclude-module=test \
            --exclude-module=grpc_tools \
            --exclude-module=lib2to3 \
            --exclude-module=pydoc \
            --exclude-module=doctest \
            ${{ env.DEBUG_FLAG }} \
            server.py
      - name: Download NSSM
        shell: powershell
        run: |
          $nssmUrl = "https://nssm.cc/release/nssm-2.24.zip"
          $nssmZip = "nssm.zip"
          $nssmDir = "nssm-extracted"
          Invoke-WebRequest -Uri $nssmUrl -OutFile $nssmZip -UseBasicParsing
          Expand-Archive -Path $nssmZip -DestinationPath $nssmDir -Force
          $nssmBin = "win64"
          New-Item -ItemType Directory -Path "..\${{ env.PLUGIN_DIR }}\dist\${{ env.BINARY_NAME }}" -Force | Out-Null
          Copy-Item "$nssmDir\nssm-2.24\$nssmBin\nssm.exe" -Destination "..\${{ env.PLUGIN_DIR }}\dist\${{ env.BINARY_NAME }}\nssm.exe"
      - name: Write Inno Setup script
        shell: powershell
        env:
          ARCH_SETTING: ${{ matrix.installer-arch }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact-suffix }}
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -notmatch '^plugin-v') { $ver = "0.0.0-${{ github.sha }}".Substring(0,13) }
          $arch = $env:ARCH_SETTING
          $name = $env:ARTIFACT_SUFFIX
          $iss = @"
          ; Inno Setup script -- gozik YouTube Music Plugin ($arch)
          #define AppName     "gozik YouTube Music Plugin"
          #define AppVersion  "$ver"
          #define AppPublisher "gosuda"
          #define AppId       "{{8A3F7C2E-1B4D-4E9A-AF12-6C9B7D3F8E21}"
          #define ServiceName "GozikYTMusicPlugin"
          #define ServiceDesc "gozik YouTube Music gRPC daemon (port 50052)"
          #define InstallDir  "{commonpf}\gozik\plugins\ytmusic"
          #define BinaryName  "${{ env.BINARY_NAME }}.exe"

          [Setup]
          AppId={#AppId}
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppPublisher={#AppPublisher}
          DefaultDirName={#InstallDir}
          DefaultGroupName=gozik
          DisableProgramGroupPage=yes
          OutputDir=installer
          OutputBaseFilename=gozik-ytmusic-plugin-$name
          Compression=lzma2/ultra64
          SolidCompression=yes
          ArchitecturesAllowed=$arch
          ArchitecturesInstallIn64BitMode=$arch
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\{#BinaryName}
          CloseApplications=no

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "..\${{ env.PLUGIN_DIR }}\dist\${{ env.BINARY_NAME }}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Run]
          Filename: "{app}\nssm.exe"; Parameters: "stop {#ServiceName}"; Flags: runhidden waituntilterminated; StatusMsg: "Stopping existing service (if any)..."; Check: ServiceExists
          Filename: "{app}\nssm.exe"; Parameters: "remove {#ServiceName} confirm"; Flags: runhidden waituntilterminated; StatusMsg: "Removing old service registration..."; Check: ServiceExists
          Filename: "{app}\nssm.exe"; Parameters: "install {#ServiceName} ""{app}\{#BinaryName}"" ""--port 50052"""; Flags: runhidden waituntilterminated; StatusMsg: "Registering gRPC daemon as a Windows service..."
          Filename: "{app}\nssm.exe"; Parameters: "set {#ServiceName} DisplayName ""{#AppName}"""; Flags: runhidden waituntilterminated
          Filename: "{app}\nssm.exe"; Parameters: "set {#ServiceName} Description ""{#ServiceDesc}"""; Flags: runhidden waituntilterminated
          Filename: "{app}\nssm.exe"; Parameters: "set {#ServiceName} Start SERVICE_AUTO_START"; Flags: runhidden waituntilterminated; StatusMsg: "Configuring service for automatic startup..."
          Filename: "{app}\nssm.exe"; Parameters: "set {#ServiceName} ObjectName LocalSystem"; Flags: runhidden waituntilterminated
          Filename: "{app}\nssm.exe"; Parameters: "start {#ServiceName}"; Flags: runhidden waituntilterminated; StatusMsg: "Starting gRPC daemon service..."

          [UninstallRun]
          Filename: "{app}\nssm.exe"; Parameters: "stop {#ServiceName}"; Flags: runhidden waituntilterminated
          Filename: "{app}\nssm.exe"; Parameters: "remove {#ServiceName} confirm"; Flags: runhidden waituntilterminated

          [Code]
          function ServiceExists: Boolean;
          var
            ResultCode: Integer;
          begin
            Exec(ExpandConstant('{app}\nssm.exe'), 'status {#ServiceName}', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Result := (ResultCode = 0);
          end;
          "@
          New-Item -ItemType Directory -Path "installer" -Force | Out-Null
          Set-Content -Path "setup.iss" -Value $iss -Encoding UTF8
      - name: Install Inno Setup
        if: matrix.arch == 'amd64'
        shell: powershell
        run: choco install innosetup --version ${{ env.INNO_SETUP_VERSION }} --no-progress -y
      - name: Install Inno Setup (ARM64 via direct download)
        if: matrix.arch == 'arm64'
        shell: powershell
        run: |
          $isUrl = "https://jrsoftware.org/download.php/is.exe"
          Invoke-WebRequest -Uri $isUrl -OutFile "innosetup_installer.exe" -UseBasicParsing
          Start-Process -FilePath "innosetup_installer.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -NoNewWindow
      - name: Compile Inno Setup installer
        shell: powershell
        run: |
          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { $iscc = $iscc.Source }
          & "$iscc" "setup.iss"
      - name: Verify installer
        id: installer-meta
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path "installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { Write-Error "No installer .exe found"; exit 1 }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLower()
          echo "installer-name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ytmusic-plugin-${{ matrix.artifact-suffix }}
          path: installer/${{ steps.installer-meta.outputs.installer-name }}
          retention-days: 30
          if-no-files-found: error

  build-macos:
    name: 'macOS ARM64 — PyInstaller + create-dmg'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone plugin repository
        run: |
          cd "${{ github.workspace }}"
          cd ..
          git clone --depth 1 "${{ env.PLUGIN_REPO }}" "${{ env.PLUGIN_DIR }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install build tools
        run: brew install create-dmg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "../${{ env.PLUGIN_DIR }}/requirements.txt"
          pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Generate protobuf stubs
        run: |
          cd "${{ github.workspace }}"
          cd "../${{ env.PLUGIN_DIR }}"
          bash codegen.sh
      - name: Build with PyInstaller
        env:
          DEBUG_FLAG: ${{ github.event.inputs.debug_build == 'true' && '--debug=all' || '' }}
        run: |
          cd "${{ github.workspace }}"
          cd "../${{ env.PLUGIN_DIR }}"
          mkdir -p certifi
          python -c "import certifi, shutil; shutil.copy(certifi.where(), 'certifi/cacert.pem')"
          pyinstaller \
            --noconfirm --clean --onedir \
            --name="${{ env.BINARY_NAME }}" \
            --distpath=dist \
            --workpath=build \
            --hidden-import=ytmusicapi \
            --hidden-import=grpc \
            --hidden-import=grpc._cython \
            --hidden-import=grpc._cython.cygrpc \
            --hidden-import=google.protobuf \
            --hidden-import=google.protobuf.internal \
            --hidden-import=yt_dlp \
            --hidden-import=yt_dlp.extractor \
            --hidden-import=yt_dlp.extractor.youtubetab \
            --hidden-import=yt_dlp.extractor.youtube \
            --hidden-import=requests \
            --hidden-import=certifi \
            --hidden-import=charset_normalizer \
            --hidden-import=idna \
            --hidden-import=urllib3 \
            --hidden-import=generated \
            --hidden-import=handlers \
            --collect-all=ytmusicapi \
            --collect-all=grpc \
            --collect-all=google.protobuf \
            --collect-all=yt_dlp \
            --collect-all=certifi \
            --add-data="generated:generated" \
            --add-data="certifi/cacert.pem:certifi" \
            --exclude-module=tkinter \
            --exclude-module=unittest \
            --exclude-module=test \
            --exclude-module=grpc_tools \
            --exclude-module=lib2to3 \
            --exclude-module=pydoc \
            --exclude-module=doctest \
            ${{ env.DEBUG_FLAG }} \
            server.py
      - name: Assemble .app bundle
        run: |
          cd "${{ github.workspace }}"
          cd ..
          APP="GozikYTMusicPlugin.app"
          BUNDLE_DIR="${{ env.PLUGIN_DIR }}/dist/${{ env.BINARY_NAME }}"
          MACOS_DIR="$APP/Contents/MacOS"
          RES_DIR="$APP/Contents/Resources"
          mkdir -p "$MACOS_DIR" "$RES_DIR"
          cp -a "$BUNDLE_DIR" "$MACOS_DIR/${{ env.BINARY_NAME }}"
          cat > "$MACOS_DIR/gozik-ytmusic-launcher.sh" <<'LAUNCHER_EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/${{ env.BINARY_NAME }}/${{ env.BINARY_NAME }}" "$@"
          LAUNCHER_EOF
          chmod +x "$MACOS_DIR/gozik-ytmusic-launcher.sh"
          cat > "$RES_DIR/com.gosuda.gozik.ytmusic.plist" <<PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key>
            <string>com.gosuda.gozik.ytmusic</string>
            <key>ProgramArguments</key>
            <array>
              <string>/Applications/GozikYTMusicPlugin.app/Contents/MacOS/gozik-ytmusic-launcher.sh</string>
              <string>--port</string>
              <string>${{ env.DAEMON_PORT }}</string>
            </array>
            <key>RunAtLoad</key>
            <true/>
            <key>KeepAlive</key>
            <true/>
            <key>StandardOutPath</key>
            <string>/tmp/gozik-ytmusic.log</string>
            <key>StandardErrorPath</key>
            <string>/tmp/gozik-ytmusic-err.log</string>
          </dict>
          </plist>
          PLIST_EOF
          cat > "$MACOS_DIR/install-daemon.sh" <<'HELPER_EOF'
          #!/bin/bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          APP_RES="$(cd "${SCRIPT_DIR}/../Resources" && pwd)"
          PLIST_SRC="${APP_RES}/com.gosuda.gozik.ytmusic.plist"
          LAUNCH_AGENTS="${HOME}/Library/LaunchAgents"
          PLIST_DST="${LAUNCH_AGENTS}/com.gosuda.gozik.ytmusic.plist"
          mkdir -p "$LAUNCH_AGENTS"
          cp -f "$PLIST_SRC" "$PLIST_DST"
          launchctl unload "$PLIST_DST" 2>/dev/null || true
          launchctl load -w "$PLIST_DST"
          echo "gozik YouTube Music daemon registered and started."
          HELPER_EOF
          chmod +x "$MACOS_DIR/install-daemon.sh"
          cat > "$MACOS_DIR/uninstall-daemon.sh" <<'UNINSTALL_EOF'
          #!/bin/bash
          set -euo pipefail
          PLIST_DST="${HOME}/Library/LaunchAgents/com.gosuda.gozik.ytmusic.plist"
          launchctl unload "$PLIST_DST" 2>/dev/null || true
          rm -f "$PLIST_DST"
          echo "gozik YouTube Music daemon unregistered."
          UNINSTALL_EOF
          chmod +x "$MACOS_DIR/uninstall-daemon.sh"
          cat > "$APP/Contents/Info.plist" <<INFO_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>gozik-ytmusic-launcher.sh</string>
            <key>CFBundleIdentifier</key>
            <string>com.gosuda.gozik.ytmusic</string>
            <key>CFBundleName</key>
            <string>gozik YouTube Music Plugin</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          INFO_EOF
      - name: Create DMG
        run: |
          cd "${{ github.workspace }}"
          cd ..
          APP="GozikYTMusicPlugin.app"
          DMG_NAME="gozik-ytmusic-plugin-macos-arm64-${{ github.ref_name }}.dmg"
          create-dmg \
            --volname "gozik YouTube Music Plugin" \
            --window-pos 200 150 \
            --window-size 640 480 \
            --icon-size 128 \
            --icon "$APP" 160 240 \
            --hide-extension "$APP" \
            --app-drop-link 480 240 \
            --background-color "#1a1a2e" \
            --no-internet-enable \
            "$DMG_NAME" "$APP" \
          || \
          create-dmg \
            --volname "gozik YouTube Music Plugin" \
            --window-pos 200 150 \
            --window-size 640 480 \
            --icon-size 128 \
            --icon "$APP" 160 240 \
            --app-drop-link 480 240 \
            "$DMG_NAME" "$APP"
          ls -lh "$DMG_NAME"
          sha256sum "$DMG_NAME"
      - name: Stage DMG for upload
        run: |
          cd "${{ github.workspace }}"
          mkdir -p artifacts
          cp ../*.dmg artifacts/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: ytmusic-plugin-macos-arm64
          path: artifacts/*.dmg
          retention-days: 30
          if-no-files-found: error

  build-linux-amd64:
    name: 'Linux AMD64 — PyInstaller + AppImage'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone plugin repository
        run: |
          cd "${{ github.workspace }}"
          cd ..
          git clone --depth 1 "${{ env.PLUGIN_REPO }}" "${{ env.PLUGIN_DIR }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache patchelf squashfs-tools file binutils libfuse2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "../${{ env.PLUGIN_DIR }}/requirements.txt"
          pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Build plugin with package.sh
        env:
          YTDLP_SKIP_NIGHTLY: '0'
        run: |
          cd "${{ github.workspace }}"
          cd "../${{ env.PLUGIN_DIR }}"
          bash package.sh
      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/plugin-v* ]]; then
            VER="${GITHUB_REF_NAME#plugin-v}"
          else
            VER="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Assemble AppDir (AMD64)
        env:
          VERSION: ${{ steps.version.outputs.ver }}
        run: |
          cd "${{ github.workspace }}"
          cd ..
          APPDIR="appdir-amd64"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${APPDIR}/usr/lib/systemd/user"
          BUNDLE_DIR="${{ env.PLUGIN_DIR }}/dist/${{ env.BINARY_NAME }}"
          cp -a "$BUNDLE_DIR" "${APPDIR}/usr/bin/${{ env.BINARY_NAME }}"
          chmod -R +x "${APPDIR}/usr/bin/${{ env.BINARY_NAME }}"
          cat > "${APPDIR}/usr/share/applications/gozik-ytmusic.desktop" <<DESKTOP_EOF
          [Desktop Entry]
          Type=Application
          Name=gozik YouTube Music Plugin
          Comment=YouTube Music gRPC daemon for gozik player
          Exec=${{ env.BINARY_NAME }} --port ${{ env.DAEMON_PORT }}
          Icon=gozik-ytmusic
          Categories=AudioVideo;Audio;
          NoDisplay=true
          X-AppImage-Version=${VERSION}
          DESKTOP_EOF
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==' | base64 -d > "${APPDIR}/usr/share/icons/hicolor/256x256/apps/gozik-ytmusic.png"
          ln -sf usr/share/applications/gozik-ytmusic.desktop "${APPDIR}/gozik-ytmusic.desktop"
          ln -sf usr/share/icons/hicolor/256x256/apps/gozik-ytmusic.png "${APPDIR}/gozik-ytmusic.png"
          cat > "${APPDIR}/usr/lib/systemd/user/gozik-ytmusic.service" <<UNIT_EOF
          [Unit]
          Description=${{ env.DAEMON_DESCRIPTION }}
          After=network.target

          [Service]
          Type=simple
          ExecStart=%h/.local/share/gozik/ytmusic/${{ env.BINARY_NAME }}/${{ env.BINARY_NAME }} --port ${{ env.DAEMON_PORT }}
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=default.target
          UNIT_EOF
          cat > "${APPDIR}/AppRun" <<'APPRUN_EOF'
          #!/bin/bash
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "${0}")")"
          BINARY_NAME='gozik-yt-music-server'
          INSTALL_DIR='${HOME}/.local/share/gozik/ytmusic'
          SYSTEMD_USER_DIR='${HOME}/.config/systemd/user'
          UNIT_NAME='gozik-ytmusic.service'
          UNIT_SRC="${HERE}/usr/lib/systemd/user/${UNIT_NAME}"
          UNIT_DST="${SYSTEMD_USER_DIR}/${UNIT_NAME}"
          BUNDLE_SRC="${HERE}/usr/bin/${BINARY_NAME}"
          BUNDLE_DST="${INSTALL_DIR}/${BINARY_NAME}"
          mkdir -p "${INSTALL_DIR}" "${SYSTEMD_USER_DIR}"
          if [[ ! -d "${BUNDLE_DST}" ]] || ! diff -rq "${BUNDLE_SRC}" "${BUNDLE_DST}" >/dev/null 2>&1; then
            echo "[gozik-ytmusic] Installing bundle to ${BUNDLE_DST}"
            rm -rf "${BUNDLE_DST}"
            cp -a "${BUNDLE_SRC}" "${BUNDLE_DST}"
            chmod -R +x "${BUNDLE_DST}"
          fi
          if [[ ! -f "${UNIT_DST}" ]] || ! cmp -s "${UNIT_SRC}" "${UNIT_DST}"; then
            echo "[gozik-ytmusic] Installing systemd unit to ${UNIT_DST}"
            sed "s|%h/.local/share/gozik/ytmusic/${BINARY_NAME}/${BINARY_NAME}|${BUNDLE_DST}/${BINARY_NAME}|g" \
              "${UNIT_SRC}" > "${UNIT_DST}"
            if command -v systemctl &>/dev/null && \
               systemctl --user is-system-running &>/dev/null 2>&1; then
              systemctl --user daemon-reload
              systemctl --user enable "${UNIT_NAME}"
              systemctl --user restart "${UNIT_NAME}" || \
                systemctl --user start "${UNIT_NAME}"
              echo '[gozik-ytmusic] Daemon registered and started via systemd.'
            else
              echo '[gozik-ytmusic] systemd not available; starting server directly.'
              exec "${BUNDLE_DST}/${BINARY_NAME}" "$@"
            fi
            exit 0
          fi
          if command -v systemctl &>/dev/null && \
             systemctl --user is-active "${UNIT_NAME}" &>/dev/null; then
            echo '[gozik-ytmusic] Daemon already running via systemd.'
            exit 0
          fi
          exec "${BUNDLE_DST}/${BINARY_NAME}" "$@"
          APPRUN_EOF
          chmod +x "${APPDIR}/AppRun"
          find "${APPDIR}" -type f | sort
      - name: Download appimagetool (AMD64)
        run: |
          cd "${{ github.workspace }}"
          cd ..
          curl -fsSL -o appimagetool \
            'https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage'
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          mv squashfs-root appimagetool-extracted
      - name: Build AppImage (AMD64)
        env:
          VERSION: ${{ steps.version.outputs.ver }}
        run: |
          cd "${{ github.workspace }}"
          cd ..
          mkdir -p dist-appimage
          APPIMAGETOOL_EXEC='./appimagetool-extracted/AppRun'
          APPIMAGE_OUT="dist-appimage/gozik-ytmusic-plugin-linux-amd64-${VERSION}.AppImage"
          ARCH=x86_64 "${APPIMAGETOOL_EXEC}" \
            --comp xz \
            appdir-amd64 \
            "${APPIMAGE_OUT}"
          chmod +x "${APPIMAGE_OUT}"
          ls -lh dist-appimage/
          sha256sum "${APPIMAGE_OUT}"
      - name: Stage AppImage for upload
        run: |
          cd "${{ github.workspace }}"
          mkdir -p artifacts
          cp ../dist-appimage/*.AppImage artifacts/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: ytmusic-plugin-linux-amd64
          path: artifacts/*.AppImage
          retention-days: 30
          if-no-files-found: error

  build-linux-arm64:

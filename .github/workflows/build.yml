name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            output: gozik-linux-amd64
            native: true
          - platform: linux/arm64
            output: gozik-linux-arm64
            native: false
          - platform: linux/riscv64
            output: gozik-linux-riscv64
            native: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Build native amd64
        if: matrix.native
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          go build -ldflags="-s -w" -o ${{ matrix.output }} ./cmd/gozik
      - name: Set up QEMU
        if: ${{ !matrix.native }}
        uses: docker/setup-qemu-action@v3
      - name: Build in container
        if: ${{ !matrix.native }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            ubuntu:24.04 bash -c "
              set -e
              apt-get update
              apt-get install -y golang-go git gcc libc6-dev libgtk-3-dev ca-certificates
              export PATH=\$PATH:\$(go env GOPATH)/bin
              go install golang.org/dl/go1.25@latest
              go1.25 download
              go1.25 build -ldflags='-s -w' -o ${{ matrix.output }} ./cmd/gozik
            "
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            msystem: MINGW64
            output: gozik-windows-amd64.exe
          - arch: arm64
            output: gozik-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Setup MSYS2
        if: matrix.arch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-pkg-config
      - name: Build amd64
        if: matrix.arch == 'amd64'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          go build -ldflags="-s -w" -o ${{ matrix.output }} ./cmd/gozik
      - name: Build arm64 (experimental)
        if: matrix.arch == 'arm64'
        continue-on-error: true
        run: |
          Write-Host "Windows/arm64 cross-compile with CGO is experimental"
          choco install llvm
          $env:CC = "clang"
          $env:GOARCH = "arm64"
          $env:CGO_ENABLED = "1"
          go build -ldflags="-s -w" -o ${{ matrix.output }} ./cmd/gozik
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64' || success()
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            output: gozik-darwin-arm64
          - os: macos-13
            arch: amd64
            output: gozik-darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Install dependencies
        run: |
          brew install gtk+3 pkg-config
      - name: Build
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.output }} ./cmd/gozik
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

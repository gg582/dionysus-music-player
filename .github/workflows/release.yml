name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute dependency checksums
        id: hashes
        run: |
          set -e
          curl -sL -o /tmp/opus.tar.gz https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
          echo "opus_sha256=$(sha256sum /tmp/opus.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          curl -sL -o /tmp/opusfile.tar.gz https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz
          echo "opusfile_sha256=$(sha256sum /tmp/opusfile.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          curl -sL -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          echo "ffmpeg_sha256=$(sha256sum /tmp/ffmpeg.tar.xz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate Flatpak manifest
        run: |
          cat > com.gosuda.gozik.player.json <<'MANIFEST'
          {
            "app-id": "com.gosuda.gozik.player",
            "runtime": "org.gnome.Platform",
            "runtime-version": "46",
            "sdk": "org.gnome.Sdk",
            "command": "gozik",
            "finish-args": [
              "--socket=wayland",
              "--socket=fallback-x11",
              "--share=ipc",
              "--share=network",
              "--device=dri",
              "--socket=pulseaudio",
              "--filesystem=home",
              "--talk-name=org.freedesktop.Notifications",
              "--own-name=com.gosuda.gozik.player"
            ],
            "modules": [
              {
                "name": "opus",
                "buildsystem": "autotools",
                "config-opts": [
                  "--disable-shared",
                  "--enable-static",
                  "--disable-doc",
                  "--disable-extra-programs"
                ],
                "sources": [
                  {
                    "type": "archive",
                    "url": "https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz",
                    "sha256": "OPUS_SHA256"
                  }
                ]
              },
              {
                "name": "opusfile",
                "buildsystem": "autotools",
                "config-opts": [
                  "--disable-shared",
                  "--enable-static",
                  "--disable-doc",
                  "--disable-examples"
                ],
                "sources": [
                  {
                    "type": "archive",
                    "url": "https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz",
                    "sha256": "OPUSFILE_SHA256"
                  }
                ]
              },
              {
                "name": "ffmpeg-static",
                "buildsystem": "simple",
                "build-commands": [
                  "install -Dm755 ffmpeg /app/bin/ffmpeg"
                ],
                "sources": [
                  {
                    "type": "archive",
                    "url": "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz",
                    "sha256": "FFMPEG_SHA256",
                    "strip-components": 1
                  }
                ]
              },
              {
                "name": "gozik",
                "buildsystem": "simple",
                "build-commands": [
                  "curl -sL https://go.dev/dl/go1.25.6.linux-amd64.tar.gz -o go.tar.gz",
                  "tar -C /tmp -xzf go.tar.gz",
                  "export PATH=/tmp/go/bin:$PATH",
                  "export CGO_ENABLED=1",
                  "go build -ldflags='-s -w -X github.com/gg582/gozik/internal/config.Prefix=/app' -o /app/bin/gozik ./cmd/gozik",
                  "install -Dm644 assets/ui/gozik-main-window.glade /app/share/gozik/ui/gozik-main-window.glade",
                  "install -Dm644 assets/ui/gozik.css /app/share/gozik/ui/gozik.css",
                  "install -Dm644 assets/ui/stars.png /app/share/gozik/ui/stars.png",
                  "install -Dm644 assets/ui/cosmos.css /app/share/gozik/ui/cosmos.css",
                  "install -Dm644 assets/gozik.desktop /app/share/applications/com.gosuda.gozik.player.desktop",
                  "install -Dm644 assets/ui/hi-res/icon.png /app/share/icons/hicolor/512x512/apps/com.gosuda.gozik.player.png"
                ],
                "sources": [
                  {
                    "type": "dir",
                    "path": "."
                  }
                ]
              }
            ]
          }
          MANIFEST
          sed -i "s/OPUS_SHA256/${{ steps.hashes.outputs.opus_sha256 }}/g" com.gosuda.gozik.player.json
          sed -i "s/OPUSFILE_SHA256/${{ steps.hashes.outputs.opusfile_sha256 }}/g" com.gosuda.gozik.player.json
          sed -i "s/FFMPEG_SHA256/${{ steps.hashes.outputs.ffmpeg_sha256 }}/g" com.gosuda.gozik.player.json

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gozik-linux-amd64.flatpak
          manifest-path: com.gosuda.gozik.player.json
          cache-key: flatpak-${{ github.sha }}
          build-bundle: true

      - uses: actions/upload-artifact@v4
        with:
          name: gozik-linux-amd64-flatpak
          path: gozik-linux-amd64.flatpak

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-libopus
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-pkg-config

      - name: Build gozik
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          export CGO_ENABLED=1
          go build -ldflags="-s -w" -o gozik.exe ./cmd/gozik

      - name: Download ffmpeg
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpeg = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName -Destination "ffmpeg.exe"

      - name: Package distribution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "gozik-windows-amd64" -Force | Out-Null
          Copy-Item "gozik.exe" "gozik-windows-amd64\"
          Copy-Item "ffmpeg.exe" "gozik-windows-amd64\"
          Copy-Item -Recurse "assets" "gozik-windows-amd64\"
          Compress-Archive -Path "gozik-windows-amd64\*" -DestinationPath "gozik-windows-amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gozik-windows-amd64
          path: gozik-windows-amd64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Install dependencies
        run: |
          brew install gtk+3 pkg-config opus opusfile create-dmg

      - name: Build gozik
        run: |
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          go build -ldflags="-s -w" -o gozik ./cmd/gozik

      - name: Download ffmpeg
        run: |
          curl -L -A "Mozilla/5.0" -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip"
          unzip -o ffmpeg.zip
          chmod +x ffmpeg

      - name: Assemble app bundle
        run: |
          APP="Gozik.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp gozik "$APP/Contents/MacOS/"
          cp ffmpeg "$APP/Contents/MacOS/"
          cp -R assets "$APP/Contents/MacOS/"

          cat > "$APP/Contents/MacOS/gozik-launcher.sh" <<'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export GOZIK_ASSETS="$DIR/assets"
          export PATH="$DIR:$PATH"
          exec "$DIR/gozik" "$@"
          EOF
          chmod +x "$APP/Contents/MacOS/gozik-launcher.sh"

          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>gozik-launcher.sh</string>
            <key>CFBundleIdentifier</key>
            <string>com.gosuda.gozik.player</string>
            <key>CFBundleName</key>
            <string>Gozik</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Gozik" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "gozik-macos-arm64.dmg" \
            "Gozik.app"

      - uses: actions/upload-artifact@v4
        with:
          name: gozik-macos-arm64
          path: gozik-macos-arm64.dmg

  release:
    runs-on: ubuntu-latest
    needs: [build-linux-flatpak, build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gozik-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true

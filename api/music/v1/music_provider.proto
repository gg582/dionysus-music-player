syntax = "proto3";

package music.v1;

option go_package = "github.com/gg582/gozik/api/music/v1;musicv1";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

enum ProviderCapability {
  PROVIDER_CAPABILITY_UNSPECIFIED = 0;
  PROVIDER_CAPABILITY_SEARCH = 1;
  PROVIDER_CAPABILITY_STREAM_TRACK = 2;
  PROVIDER_CAPABILITY_LIBRARY_MANAGEMENT = 3;
}

enum AuthStatus {
  AUTH_STATUS_UNSPECIFIED = 0;
  AUTH_STATUS_UNAUTHENTICATED = 1;
  AUTH_STATUS_AUTHENTICATED = 2;
  AUTH_STATUS_EXPIRED = 3;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_TRACK = 1;
  MEDIA_TYPE_ALBUM = 2;
  MEDIA_TYPE_ARTIST = 3;
  MEDIA_TYPE_PLAYLIST = 4;
}

enum AudioQuality {
  AUDIO_QUALITY_UNSPECIFIED = 0;
  AUDIO_QUALITY_LOW = 1;
  AUDIO_QUALITY_MEDIUM = 2;
  AUDIO_QUALITY_HIGH = 3;
}

// ---------------------------------------------------------------------------
// Shared Messages
// ---------------------------------------------------------------------------

message Image {
  string url = 1;
  int32 width = 2;
  int32 height = 3;
}

message Artist {
  string id = 1;
  string name = 2;
}

message Album {
  string id = 1;
  string title = 2;
  repeated Artist artists = 3;
  repeated Image images = 4;
  int32 release_year = 5;
  int32 track_count = 6;
}

message Track {
  string id = 1;
  string title = 2;
  repeated Artist artists = 3;
  Album album = 4;
  int64 duration_ms = 5;
  repeated Image images = 6;
  bool explicit = 7;
}

message Playlist {
  string id = 1;
  string title = 2;
  string description = 3;
  string owner_name = 4;
  repeated Image images = 5;
  int32 track_count = 6;
}

// ---------------------------------------------------------------------------
// Provider Information & Auth
// ---------------------------------------------------------------------------

message GetProviderMetadataRequest {}

message GetProviderMetadataResponse {
  string provider_id = 1;
  string display_name = 2;
  repeated ProviderCapability capabilities = 3;
  AuthStatus auth_status = 4;
  string auth_url = 5;
}

message InitiateAuthRequest {
  // Optional provider-specific parameters. For spotify this can carry a
  // client_id so the user does not have to set it via environment variables.
  map<string, string> params = 1;
}

message InitiateAuthResponse {
  string auth_url = 1;
  string device_code = 2;
}

message CompleteAuthRequest {
  map<string, string> params = 1;
}

message CompleteAuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
}

message RefreshAuthRequest {
  string refresh_token = 1;
}

message RefreshAuthResponse {
  string access_token = 1;
  int64 expires_at = 2;
}

// ---------------------------------------------------------------------------
// Search & Discovery
// ---------------------------------------------------------------------------

message SearchRequest {
  string query = 1;
  repeated MediaType types = 2;
  int32 limit = 3;
  string page_token = 4;
}

message SearchResponse {
  repeated Track tracks = 1;
  repeated Album albums = 2;
  repeated Artist artists = 3;
  repeated Playlist playlists = 4;
  string next_page_token = 5;
}

message SearchSuggestionsRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchSuggestionsResponse {
  string suggestion = 1;
  MediaType type = 2;
  string related_id = 3;
}

// ---------------------------------------------------------------------------
// Media Management
// ---------------------------------------------------------------------------

message GetTrackDetailsRequest {
  string track_id = 1;
}

message GetTrackDetailsResponse {
  Track track = 1;
}

message ResolveStreamRequest {
  string track_id = 1;
  AudioQuality preferred_quality = 2;
}

message ResolveStreamResponse {
  string stream_url = 1;
  map<string, string> headers = 2;
  int64 expiry_ms = 3;
}

message StreamAudioRequest {
  string track_id = 1;
  AudioQuality quality = 2;
  int64 start_position_ms = 3;
}

message AudioChunk {
  bytes data = 1;
  int64 timestamp_ms = 2;
  bool eof = 3;
}

// ---------------------------------------------------------------------------
// Library & Playlists
// ---------------------------------------------------------------------------

message GetUserLibraryRequest {
  int32 limit = 1;
  string page_token = 2;
}

message GetUserLibraryResponse {
  repeated Track tracks = 1;
  string next_page_token = 2;
}

message GetUserPlaylistsRequest {
  int32 limit = 1;
  string page_token = 2;
}

message GetUserPlaylistsResponse {
  repeated Playlist playlists = 1;
  string next_page_token = 2;
}

message GetPlaylistDetailsRequest {
  string playlist_id = 1;
  int32 limit = 2;
  string page_token = 3;
}

message GetPlaylistDetailsResponse {
  Playlist playlist = 1;
  repeated Track tracks = 2;
  string next_page_token = 3;
}

// ---------------------------------------------------------------------------
// Service Definition
// ---------------------------------------------------------------------------

service MusicProviderService {
  rpc GetProviderMetadata(GetProviderMetadataRequest) returns (GetProviderMetadataResponse);
  rpc InitiateAuth(InitiateAuthRequest) returns (InitiateAuthResponse);
  rpc CompleteAuth(CompleteAuthRequest) returns (CompleteAuthResponse);
  rpc RefreshAuth(RefreshAuthRequest) returns (RefreshAuthResponse);

  rpc Search(SearchRequest) returns (SearchResponse);
  rpc SearchSuggestions(SearchSuggestionsRequest) returns (stream SearchSuggestionsResponse);

  rpc GetTrackDetails(GetTrackDetailsRequest) returns (GetTrackDetailsResponse);
  rpc ResolveStream(ResolveStreamRequest) returns (ResolveStreamResponse);
  rpc StreamAudio(StreamAudioRequest) returns (stream AudioChunk);

  rpc GetUserLibrary(GetUserLibraryRequest) returns (GetUserLibraryResponse);
  rpc GetUserPlaylists(GetUserPlaylistsRequest) returns (GetUserPlaylistsResponse);
  rpc GetPlaylistDetails(GetPlaylistDetailsRequest) returns (GetPlaylistDetailsResponse);
}
